<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXCART | Login & Register</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="auth-container">

        <h1 class="logo">NEXCART</h1>
        <p class="subtitle">Welcome to Premium Shopping</p>

        <div class="auth-tabs">
            <button id="loginTab" class="active">Login</button>
            <button id="registerTab">Register</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm">

            <h2>Welcome Back</h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button type="submit" class="submit-btn">
                Login
            </button>

        </form>

        <!-- Register Form -->
        <form id="registerForm" class="hidden">

            <h2>Create Account</h2>

            <input
                type="text"
                id="registerName"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="registerEmail"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="registerPassword"
                placeholder="Create Password"
                minlength="8"
                required
            >

            <button type="submit" class="submit-btn">
                Register
            </button>

        </form>

        <p id="authMessage"></p>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </div>

    <script src="login.js"></script>

</body>
</html>
